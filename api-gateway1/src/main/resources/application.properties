spring.application.name=api-gateway1

# HTTPS
server.port=8445
server.ssl.enabled=true
server.ssl.key-store=classpath:edupulse-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=edupulse

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Student Service
spring.cloud.gateway.server.webmvc.routes[0].id=student-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://student-service1
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/students/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Result Service
spring.cloud.gateway.server.webmvc.routes[1].id=result-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://result-service1
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/results/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Attendance Service
spring.cloud.gateway.server.webmvc.routes[2].id=attendance-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://attendance-service1
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/attendance/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Auth Service
spring.cloud.gateway.server.webmvc.routes[3].id=auth-service
spring.cloud.gateway.server.webmvc.routes[3].uri=https://localhost:8443
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/auth/**