spring.application.name=auth-service2

server.port=8443

# HTTPS
server.ssl.enabled=true
server.ssl.key-store=classpath:edupulse-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=edupulse

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/edupulse_auth
spring.datasource.username=postgres
spring.datasource.password=1305

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true